<!DOCTYPE html>
<html lang="nl-BE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Thor Arnouts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="border-b border-slate-700">
        <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between px-4 py-3 sm:flex-col sm:gap-2 lg:flex-row lg:justify-between">
            <a href="index.html" class="shrink-0">
                <img src="images/logo.png" alt="Logo van Thor Arnouts" width="200" height="200" class="size-12 rounded-full">
            </a>
            <input type="checkbox" id="menu-knop" class="peer sr-only">
            <label for="menu-knop" class="cursor-pointer rounded-lg border border-slate-500 px-3 py-2 text-slate-200 peer-focus-visible:outline-2 peer-focus-visible:outline-[#26F0E9] sm:hidden">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-6" aria-hidden="true">
                    <path d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <span class="sr-only">Menu</span>
            </label>
            <nav aria-label="Hoofdmenu" class="hidden w-full peer-checked:block sm:block sm:w-auto">
                <ul class="flex flex-col sm:flex-row sm:gap-2">
                    <li>
                        <a href="index.html" class="block rounded-lg px-3 py-2 text-slate-200 hover:bg-slate-800 hover:text-[#26F0E9]">Home</a>
                    </li>
                    <li>
                        <a href="portfolio.html" class="block rounded-lg px-3 py-2 text-slate-200 hover:bg-slate-800 hover:text-[#26F0E9]">Portfolio</a>
                    </li>
                    <li>
                        <a href="project.html" class="block rounded-lg px-3 py-2 text-slate-200 hover:bg-slate-800 hover:text-[#26F0E9]">Project</a>
                    </li>
                    <li>
                        <a href="contact.html" aria-current="page" class="block rounded-lg bg-[#28F088] px-3 py-2 font-semibold text-slate-900">Contact</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="mx-auto grid w-full max-w-6xl grid-cols-1 gap-8 px-4 py-8 lg:grid-cols-3">
        <main class="lg:col-span-2">
            <h1 class="mb-6 text-3xl font-semibold tracking-tight text-white md:text-4xl">Contact</h1>
            <form class="flex max-w-md flex-col gap-6">
                <div class="flex flex-col gap-1">
                    <label for="naam" class="font-semibold text-slate-200">Naam</label>
                    <input type="text" id="naam" name="naam" autocomplete="name" class="rounded-lg border border-slate-600 bg-slate-800 px-3 py-3 text-white focus:border-[#26F0E9]">
                </div>
                <div class="flex flex-col gap-1">
                    <label for="mail" class="font-semibold text-slate-200">Mail</label>
                    <input type="email" id="mail" name="mail" autocomplete="email" class="rounded-lg border border-slate-600 bg-slate-800 px-3 py-3 text-white focus:border-[#26F0E9]">
                </div>
                <div class="flex flex-col gap-1">
                    <label for="tel" class="font-semibold text-slate-200">Tel</label>
                    <input type="tel" id="tel" name="tel" autocomplete="tel" class="rounded-lg border border-slate-600 bg-slate-800 px-3 py-3 text-white focus:border-[#26F0E9]">
                </div>
            </form>
        </main>

        <aside class="border-t border-slate-700 pt-6 lg:border-t-0 lg:border-l lg:pl-8 lg:pt-0">
            <div role="img" aria-label="Kaart met een locatiemarkering (voorlopig)" class="flex aspect-video items-center justify-center rounded-lg border border-slate-700 bg-slate-800 lg:aspect-[3/4]">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-12 text-[#28F088]" aria-hidden="true">
                    <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
                    <circle cx="12" cy="10" r="3" />
                </svg>
            </div>
        </aside>
    </div>

    <footer class="border-t border-slate-700">
        <div class="mx-auto flex max-w-6xl justify-end px-4 py-4 text-sm text-slate-400">
            <p>&copy; 2026 Thor Arnouts</p>
        </div>
    </footer>
</body>
</html>
